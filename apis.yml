aid: april
name: April
description: >-
  April (aPriori, apr.io) is a MEV-powered liquid staking protocol on the Monad
  blockchain. Users stake MON tokens through aPriori's self-custodial staking vault
  and receive aprMON, a reward-bearing liquid staking token that accrues proof-of-stake
  plus MEV yield and can be used across Monad DeFi while retaining full custody. The
  protocol also operates Swapr (a DEX aggregator), an order-flow segmentation and MEV
  infrastructure layer, and the $APR token with an APR Boost rewards program. aPriori
  is documented on GitBook with an introduction, a Monad testnet guide, a MON faucet
  guide, and a smart-contract integration reference; it is a smart-contract protocol
  rather than a keyed REST API. Surfaced into the API Evangelist network as a crypto
  portfolio lead.
